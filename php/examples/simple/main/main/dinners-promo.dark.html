    /* Единый popover с цельной границей */
    .bs-popover-top>.arrow,
    .bs-popover-auto[x-placement^="top"]>.arrow {
        bottom: calc(-0.5rem) !important;
    }

    .popover {
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .popover .popover-body {
        font-family: "Stolzl Book", Arial, Helvetica Neue, Helvetica, sans-serif;
        text-align: left;
        padding: 12px 16px;
        border-radius: 8px;
        position: relative;
        z-index: 2;
    }

    /* Стрелка - делаем ее частью тела */
    .popover .popover-arrow {
        z-index: 1;
    }

    .popover .popover-arrow::before {
        border-color: rgba(0, 0, 0, 0.15) !important;
    }

    .popover .popover-arrow::after {
        content: '';
        position: absolute;
        display: block;
        width: 12px;
        height: 12px;
        background: #fff;
        transform: rotate(45deg);
        z-index: 3;
    }

    /* Справа (основной вариант для левого расположения) */
    .popover.bs-popover-right .popover-arrow::after {
        left: 1px;
        top: 0;
        border: none;
        border-right: none;
        border-top: none;
        background: #fff;
    }

    /* Слева */
    .popover.bs-popover-left .popover-arrow::after {
        right: 1px;
        bottom: 0;
        border: none;
        border-left: none;
        border-bottom: none;
        background: #fff;
    }

    /* Сверху */
    .popover.bs-popover-top .popover-arrow::after {
        top: 1px;
        left: 0;
        border: none;
        border-top: none;
        border-left: none;
        background: #fff;
    }

    /* Снизу */
    .popover.bs-popover-bottom .popover-arrow::after {
        bottom: 1px;
        right: 0;
        border: none;
        border-bottom: none;
        border-right: none;
        background: #fff;
    }

    /* Темная тема */
    .popover.popover-dark {
        background: #2d2d2d;
        border-color: rgba(255, 255, 255, 0.1);
    }

    .popover.popover-dark .popover-body {
        color: #f0f0f0;
        background: #2d2d2d;
    }

    .popover.popover-dark .popover-arrow::before {
        border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .popover.popover-dark .popover-arrow::after {
        background: #2d2d2d;
    }

    /* Дополнительные стили для collapse - темная тема */
    .services-toggle-btn-dark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: transparent;
        border: none;

    .services-toggle-btn-dark .collapse-icon-dark {

    }

    .services-toggle-btn-dark .collapse-icon-dark.rotated {

    .services-collapse-wrap-dark {

    .services-collapse-wrap-dark.collapsing {

    .services-collapse-wrap-dark.show {

</style>

<script>
    $(function () {
        $('#servicesBlock .feature-item').popover({
            trigger: 'hover',
            placement: 'top',
            html: true,
            container: 'body'
        });

        // Обработка toggle для темной темы
        $('#servicesCollapseDark').on('show.bs.collapse', function () {
            $('#toggleTextDark').text('Скрыть варианты');
            $('#toggleIconDark').addClass('rotated');
        });

        $('#servicesCollapseDark').on('hide.bs.collapse', function () {
            $('#toggleTextDark').text('Показать варианты');
            $('#toggleIconDark').removeClass('rotated');
        });
    });
</script>
